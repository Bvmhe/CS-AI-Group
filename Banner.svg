<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#121217"/>
    </linearGradient>

    <!-- Wok Gradients -->
    <linearGradient id="wokInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="wokBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#666"/>
      <stop offset="50%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b5a35"/>
      <stop offset="100%" stop-color="#4a2a15"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffdf73"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blurSteam">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1000" height="300" fill="url(#bgGrad)"/>

  <!-- ================= LEFT SIDE (TEXT) ================= -->
  <g transform="translate(100, 150)">
    <text x="0" y="-20" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="1">
      FENGWEI
    </text>
    <text x="0" y="30" font-family="'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">
      FRIED RICE
    </text>
    <line x1="0" y1="50" x2="280" y2="50" stroke="#ff9f1c" stroke-width="3" opacity="0.8"/>
    <text x="0" y="80" font-family="'Courier New', monospace" font-size="16" fill="#a0a0a0" letter-spacing="2">
      &lt; Wok Mastery &amp; Code /&gt;
    </text>
  </g>

  <!-- ================= RIGHT SIDE (ILLUSTRATION) ================= -->
  <g transform="translate(650, 150)">
    
    <!-- AMBIENT FIRE GLOW -->
    <ellipse cx="0" cy="80" rx="120" ry="25" fill="#ff4500" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="25;30;25" dur="0.6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- STEAM -->
    <g opacity="0.3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" filter="url(#blurSteam)">
      <path d="M -40 -100 Q -60 -130 -40 -160">
        <animate attributeName="opacity" values="0.5;0" dur="2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 20 -90 Q 0 -120 20 -150">
        <animate attributeName="opacity" values="0.4;0" dur="2.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60 -70 Q 40 -100 60 -130">
        <animate attributeName="opacity" values="0.3;0" dur="2.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- WOK GROUP (Goyang Animasi) -->
    <g>
      <animateTransform attributeName="transform" type="translate" 
        values="0,0; -3,-2; 4,1; 0,0" dur="0.5s" repeatCount="indefinite" />

      <!-- Handle Wok (Kanan) -->
      <path d="M 150 15 L 250 5 Q 260 3 260 10 L 260 25 Q 260 32 250 30 L 150 35 Z" fill="url(#handleGrad)"/>
      <rect x="245" y="5" width="15" height="25" rx="3" fill="#111" stroke="#555" stroke-width="1"/>

      <!-- Wok Body (Bulat Utuh) -->
      <path d="M -160 10 A 160 120 0 0 0 160 10 Z" fill="url(#wokBody)" />
      
      <!-- Wok Inner (Cekung) -->
      <ellipse cx="0" cy="10" rx="160" ry="35" fill="url(#wokInner)" stroke="#000" stroke-width="2"/>
      
      <!-- Wok Rim (Bibir Wok) -->
      <ellipse cx="0" cy="10" rx="160" ry="35" fill="none" stroke="url(#rim)" stroke-width="4" opacity="0.9"/>
      
      <!-- Minyak / Saus di dasar wok -->
      <ellipse cx="0" cy="20" rx="100" ry="15" fill="#2d1b10" opacity="0.8"/>
      
      <!-- Pantulan Cahaya di dalam wok -->
      <path d="M -100 15 Q 0 5 100 15" stroke="#555" stroke-width="2" fill="none" opacity="0.4"/>
    </g>

    <!-- NASI GORENG TERLEMPAR (Animasi Melengkung ke Atas) -->
    <g>
      <!-- Animasi melengkung: naik, geser kiri, turun -->
      <animateTransform attributeName="transform" type="translate" 
        values="0,10; -15,-30; 0,10" dur="0.8s" repeatCount="indefinite" />

      <!-- Gundukan Nasi Utama (Menggunakan kurva bezier biar tidak kotak) -->
      <path d="M -80 10 
               C -120 -80 -80 -130 0 -150 
               C 70 -160 100 -100 80 10 
               C 50 30 -50 30 -80 10 Z" 
            fill="#fcf3d4" />

      <!-- Tekstur Bayangan Nasi -->
      <path d="M -60 -80 C -30 -120 40 -130 70 -90" fill="none" stroke="#e6d5a3" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

      <!-- Butiran Nasi Hambur (Putih & Emas) -->
      <g fill="#fff6d9">
        <circle cx="-70" cy="-40" r="4" />
        <circle cx="-50" cy="-80" r="3.5" />
        <circle cx="-20" cy="-110" r="4" />
        <circle cx="10" cy="-130" r="3" />
        <circle cx="40" cy="-120" r="4" />
        <circle cx="70" cy="-80" r="3.5" />
        <circle cx="85" cy="-30" r="4" />
        <circle cx="40" cy="-140" r="3" />
        <circle cx="-90" cy="-10" r="4" />
      </g>
      <g fill="#ffd966">
        <circle cx="-60" cy="-60" r="3" />
        <circle cx="-30" cy="-100" r="4" />
        <circle cx="20" cy="-120" r="3" />
        <circle cx="50" cy="-100" r="4.5" />
        <circle cx="75" cy="-60" r="3" />
        <circle cx="-80" cy="-20" r="3" />
      </g>

      <!-- Udang (Warna Merah Muda/Coral) -->
      <g fill="#ff7b6b" stroke="#e55c4c" stroke-width="1.5">
        <!-- Udang 1 -->
        <path d="M -50 -70 Q -35 -85 -20 -75 Q -10 -65 -25 -55 Q -40 -45 -50 -70 Z" />
        <circle cx="-20" cy="-75" r="2.5" fill="#fff" stroke="none" /> 
        <!-- Udang 2 -->
        <path d="M 30 -110 Q 45 -125 60 -115 Q 70 -105 55 -95 Q 40 -85 30 -110 Z" />
        <circle cx="60" cy="-115" r="2.5" fill="#fff" stroke="none" />
        <!-- Udang 3 -->
        <path d="M -10 -95 Q 5 -110 20 -100 Q 30 -90 15 -80 Q 0 -70 -10 -95 Z" />
        <circle cx="20" cy="-100" r="2.5" fill="#fff" stroke="none" />
      </g>

      <!-- Kacang Polong (Hijau) -->
      <g fill="#7bc043" stroke="#559a2b" stroke-width="1.5">
        <circle cx="-35" cy="-85" r="5" />
        <circle cx="5" cy="-120" r="5.5" />
        <circle cx="45" cy="-95" r="5" />
        <circle cx="65" cy="-70" r="4.5" />
        <circle cx="-65" cy="-50" r="5" />
        <circle cx="-20" cy="-130" r="4" />
      </g>

      <!-- Daun Bawang (Irisan Hijau) -->
      <g fill="#4caf50">
        <rect x="-40" y="-95" width="7" height="3" transform="rotate(45 -40 -95)" rx="1" />
        <rect x="15" y="-110" width="7" height="3" transform="rotate(-30 15 -110)" rx="1" />
        <rect x="55" y="-85" width="7" height="3" transform="rotate(20 55 -85)" rx="1" />
        <rect x="-80" y="-30" width="7" height="3" transform="rotate(-15 -80 -30)" rx="1" />
      </g>
    </g>
  </g>
</svg>
