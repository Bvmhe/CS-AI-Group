<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="60%" r="75%">
      <stop offset="0%" stop-color="#2d1b3d"/>
      <stop offset="45%" stop-color="#1a1128"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </radialGradient>

    <!-- Warm glow behind wok -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8c00" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ff4500" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
    </radialGradient>

    <!-- Wok body gradient (metal) -->
    <linearGradient id="wokBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="30%" stop-color="#2e2e2e"/>
      <stop offset="70%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <!-- Wok rim highlight -->
    <linearGradient id="wokRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>

    <!-- Fire gradient -->
    <radialGradient id="fireCore">
      <stop offset="0%" stop-color="#fff4b0"/>
      <stop offset="35%" stop-color="#ffb300"/>
      <stop offset="70%" stop-color="#ff5500" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>

    <!-- Handle gradient -->
    <linearGradient id="handle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0653a"/>
      <stop offset="50%" stop-color="#6b3f1f"/>
      <stop offset="100%" stop-color="#3a1f0c"/>
    </linearGradient>

    <!-- Steel spatula -->
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#5a5a5a"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>

    <!-- Steam filter -->
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Glow filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- Subtle grid texture -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
  </g>

  <!-- Warm ambient glow -->
  <ellipse cx="450" cy="230" rx="260" ry="130" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ===== FIRE ===== -->
  <g>
    <ellipse cx="450" cy="245" rx="120" ry="35" fill="url(#fireCore)">
      <animate attributeName="rx" values="120;130;115;125;120" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="35;42;32;40;35" dur="0.5s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Flame tongues -->
    <g opacity="0.9">
      <path d="M 380 240 Q 390 210 400 235 Q 410 215 420 240" fill="#ffaa00" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="0.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 470 240 Q 480 205 495 235 Q 505 210 515 240" fill="#ff7700" opacity="0.7">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- ===== STEAM ===== -->
  <g filter="url(#soft)" opacity="0.45">
    <circle cx="420" cy="120" r="10" fill="#ffffff">
      <animate attributeName="cy" values="150;70" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;18" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="110" r="12" fill="#ffffff">
      <animate attributeName="cy" values="145;60" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="10;22" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="115" r="10" fill="#ffffff">
      <animate attributeName="cy" values="150;75" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="9;20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== WOK (with toss animation) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -2,-4; 2,0; 0,0" dur="0.45s" repeatCount="indefinite"/>

    <!-- Handle -->
    <rect x="590" y="185" width="135" height="16" rx="8" fill="url(#handle)" stroke="#2a1508" stroke-width="1.5"/>
    <rect x="700" y="185" width="30" height="16" rx="8" fill="#1a0d05"/>

    <!-- Wok body -->
    <path d="M 290 190 Q 450 305 610 190 Z" fill="url(#wokBody)" stroke="#000" stroke-width="1.5"/>

    <!-- Wok inner shadow -->
    <path d="M 300 190 Q 450 295 600 190 Q 450 260 300 190 Z" fill="#0a0a0a" opacity="0.6"/>

    <!-- Wok rim -->
    <ellipse cx="450" cy="190" rx="162" ry="26" fill="url(#wokRim)" stroke="#0a0a0a" stroke-width="1.5"/>
    <ellipse cx="450" cy="190" rx="150" ry="20" fill="#1a1a1a"/>

    <!-- Rim highlight (specular) -->
    <path d="M 320 185 Q 450 172 590 185" stroke="#b0b0b0" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>

  <!-- ===== FRIED RICE inside wok ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 2,-2; -2,1; 0,0" dur="0.35s" repeatCount="indefinite"/>

    <!-- Rice base mound -->
    <ellipse cx="450" cy="185" rx="120" ry="14" fill="#e8d9a8" opacity="0.9"/>
    <ellipse cx="450" cy="182" rx="100" ry="10" fill="#f5e7b8"/>

    <!-- Rice grains scatter -->
    <g>
      <ellipse cx="380" cy="183" rx="5" ry="2.5" fill="#fff5cc" transform="rotate(15 380 183)"/>
      <ellipse cx="400" cy="180" rx="5" ry="2.5" fill="#ffd966" transform="rotate(-20 400 180)"/>
      <ellipse cx="420" cy="184" rx="5" ry="2.5" fill="#fff5cc" transform="rotate(30 420 184)"/>
      <ellipse cx="445" cy="181" rx="5" ry="2.5" fill="#ffd966"/>
      <ellipse cx="470" cy="183" rx="5" ry="2.5" fill="#fff5cc" transform="rotate(-15 470 183)"/>
      <ellipse cx="495" cy="180" rx="5" ry="2.5" fill="#ffd966" transform="rotate(25 495 180)"/>
      <ellipse cx="515" cy="184" rx="5" ry="2.5" fill="#fff5cc"/>
      <ellipse cx="390" cy="188" rx="4" ry="2" fill="#ffcc33"/>
      <ellipse cx="440" cy="189" rx="4" ry="2" fill="#ffcc33"/>
      <ellipse cx="500" cy="188" rx="4" ry="2" fill="#ffcc33"/>
    </g>

    <!-- Veggies & protein bits -->
    <circle cx="410" cy="185" r="3" fill="#7bc043"/>
    <circle cx="435" cy="187" r="2.5" fill="#ff6347"/>
    <circle cx="460" cy="184" r="3" fill="#7bc043"/>
    <circle cx="485" cy="187" r="2.5" fill="#ff6347"/>
    <circle cx="505" cy="185" r="2.5" fill="#7bc043"/>
    <circle cx="375" cy="186" r="2" fill="#e8a33d"/>
    <circle cx="525" cy="187" r="2" fill="#e8a33d"/>

    <!-- Green onion sprinkles -->
    <rect x="425" y="179" width="6" height="2" fill="#4caf50" transform="rotate(20 428 180)"/>
    <rect x="455" y="178" width="6" height="2" fill="#4caf50" transform="rotate(-25 458 179)"/>
    <rect x="490" y="180" width="5" height="2" fill="#4caf50" transform="rotate(15 492 181)"/>
  </g>

  <!-- ===== AIRBORNE RICE (tossed up) ===== -->
  <g>
    <ellipse cx="420" cy="150" rx="4" ry="2" fill="#fff5cc">
      <animate attributeName="cy" values="175;120;175" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="420;435;420" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="0.9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="145" rx="4" ry="2" fill="#ffd966">
      <animate attributeName="cy" values="180;115;180" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="450;440;450" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="475" cy="148" rx="4" ry="2" fill="#fff5cc">
      <animate attributeName="cy" values="178;125;178" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="475;465;475" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="1s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="435" cy="140" r="2" fill="#7bc043">
      <animate attributeName="cy" values="180;130;180" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="465" cy="138" r="2" fill="#ff6347">
      <animate attributeName="cy" values="180;128;180" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== SPATULA (sudip) ===== -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-8 560 190; 12 560 190; -8 560 190" dur="0.55s" repeatCount="indefinite"/>

    <!-- handle -->
    <rect x="555" y="120" width="7" height="70" rx="3" fill="url(#steel)"/>
    <!-- head -->
    <path d="M 540 185 L 577 185 L 570 205 L 547 205 Z" fill="url(#steel)" stroke="#5a5a5a" stroke-width="1"/>
  </g>

  <!-- ===== TITLE ===== -->
  <text x="450" y="55" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',sans-serif"
        font-size="46" font-weight="900"
        fill="url(#titleGrad)" filter="url(#neonGlow)"
        letter-spacing="2">
    FENGWEI FRIED RICE
  </text>

  <!-- Small decorative line under title -->
  <line x1="300" y1="70" x2="600" y2="70" stroke="#ff9f1c" stroke-width="2" opacity="0.7"/>

  <!-- Subtitle -->
  <text x="450" y="90" text-anchor="middle"
        font-family="'Georgia',serif"
        font-size="15" font-style="italic"
        fill="#d4c5a0" letter-spacing="4">
    ~ Fresh from the Wok ~
  </text>
</svg>
