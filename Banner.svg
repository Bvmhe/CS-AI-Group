<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    
    <!-- Wok Gradients -->
    <linearGradient id="wokBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="30%" stop-color="#222"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    
    <linearGradient id="wokInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>

    <!-- Handle Gradients -->
    <linearGradient id="metalNeck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="woodHandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b5a35"/>
      <stop offset="20%" stop-color="#d19b6a"/>
      <stop offset="60%" stop-color="#8a4f2a"/>
      <stop offset="100%" stop-color="#3a1f0c"/>
    </linearGradient>

    <!-- Shrimp & Peas Gradients -->
    <linearGradient id="shrimpColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e8e"/>
      <stop offset="100%" stop-color="#e84a35"/>
    </linearGradient>
    <linearGradient id="peaColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a4de5c"/>
      <stop offset="100%" stop-color="#5a9c27"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffdf73"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1000" height="300" fill="url(#bgGrad)"/>

  <!-- ================= LEFT SIDE (TEXT) ================= -->
  <g transform="translate(100, 150)">
    <text x="0" y="-20" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="1">
      FENGWEI
    </text>
    <text x="0" y="30" font-family="'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">
      FRIED RICE
    </text>
    <line x1="0" y1="50" x2="280" y2="50" stroke="#ff9f1c" stroke-width="3" opacity="0.8"/>
    <text x="0" y="80" font-family="'Courier New', monospace" font-size="16" fill="#a0a0a0" letter-spacing="2">
      &lt; Wok Mastery &amp; Code /&gt;
    </text>
  </g>

  <!-- ================= RIGHT SIDE (ILLUSTRATION) ================= -->
  <!-- WOK DIMIRINGKAN (ROTASI) -->
  <g transform="translate(700, 150) rotate(-15)">
    
    <!-- WOK GROUP (Goyang Animasi) -->
    <g>
      <animateTransform attributeName="transform" type="translate" 
        values="0,0; -5,3; 5,-2; 0,0" dur="0.5s" repeatCount="indefinite" />

      <!-- Konektor Metal -->
      <path d="M 120 -10 L 180 -25 L 180 5 L 120 20 Z" fill="url(#metalNeck)"/>
      
      <!-- Gagang Kayu -->
      <path d="M 180 -25 Q 240 -40 260 -50 L 265 -30 Q 240 -20 180 5 Z" fill="url(#woodHandle)"/>
      
      <!-- Bodi Wok -->
      <path d="M -160 0 A 160 110 0 0 0 160 0 Z" fill="url(#wokBody)"/>
      
      <!-- Rongga Dalam Wok -->
      <ellipse cx="0" cy="0" rx="160" ry="35" fill="url(#wokInner)" stroke="#bbb" stroke-width="2"/>
      
      <!-- Minyak di dasar wok -->
      <ellipse cx="0" cy="10" rx="110" ry="18" fill="#1c1008" opacity="0.9"/>
      <path d="M -60 5 Q 0 -5 60 5" fill="none" stroke="#555" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- ================= NASI & TOPPING TERBANG ================= -->
    <g>
      <!-- Animasi melengkung: geser kiri, naik, lalu turun -->
      <animateTransform attributeName="transform" type="translate" 
        values="0,0; -15,-30; 0,0" dur="0.7s" repeatCount="indefinite" />

      <!-- Gundukan Nasi Utama (Bergelombang/Fluffy) -->
      <path d="M -80 0 C -110 -40 -90 -90 -50 -110 C -20 -125 10 -140 40 -110 C 70 -80 90 -40 80 0 Z" fill="#fcf3d4" />
      
      <!-- Bayangan Nasi (Memberi tekstur gundukan) -->
      <path d="M -60 -30 C -80 -60 -50 -90 -20 -100 C 10 -110 30 -90 50 -60" fill="none" stroke="#e6d5a3" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
      <path d="M 10 -110 C 30 -120 50 -100 60 -70" fill="none" stroke="#e6d5a3" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

      <!-- Butiran Nasi Detail (Bentuk beras melengkung) -->
      <g fill="#fff6d9">
        <path d="M -70 -20 Q -65 -25 -60 -20 Q -65 -15 -70 -20 Z" />
        <path d="M -50 -60 Q -45 -65 -40 -60 Q -45 -55 -50 -60 Z" />
        <path d="M -30 -90 Q -25 -95 -20 -90 Q -25 -85 -30 -90 Z" />
        <path d="M 0 -110 Q 5 -115 10 -110 Q 5 -105 0 -110 Z" />
        <path d="M 30 -100 Q 35 -105 40 -100 Q 35 -95 30 -100 Z" />
        <path d="M 60 -70 Q 65 -75 70 -70 Q 65 -65 60 -70 Z" />
        <path d="M 70 -30 Q 75 -35 80 -30 Q 75 -25 70 -30 Z" />
      </g>
      <g fill="#ffd966">
        <path d="M -60 -40 Q -55 -45 -50 -40 Q -55 -35 -60 -40 Z" />
        <path d="M -20 -70 Q -15 -75 -10 -70 Q -15 -65 -20 -70 Z" />
        <path d="M 20 -120 Q 25 -125 30 -120 Q 25 -115 20 -120 Z" />
        <path d="M 50 -90 Q 55 -95 60 -90 Q 55 -85 50 -90 Z" />
      </g>

      <!-- ================= TOPPING & HAMBURAN ================= -->
      
      <!-- Udang (Warna Coral/Merah Muda) -->
      <g fill="url(#shrimpColor)" stroke="#c23b27" stroke-width="1.5">
        <!-- Udang 1 -->
        <path d="M -65 -30 C -80 -50 -50 -70 -40 -55 C -30 -40 -45 -15 -65 -30 Z" />
        <circle cx="-50" cy="-55" r="2" fill="#fff" stroke="none" />
        <!-- Udang 2 -->
        <path d="M -20 -95 C -35 -115 -5 -130 5 -115 C 15 -100 0 -80 -20 -95 Z" />
        <circle cx="5" cy="-115" r="2" fill="#fff" stroke="none" />
        <!-- Udang 3 -->
        <path d="M 40 -110 C 25 -130 55 -145 65 -125 C 75 -105 55 -90 40 -110 Z" />
        <circle cx="65" cy="-125" r="2" fill="#fff" stroke="none" />
        <!-- Udang 4 (Terbang Terpisah) -->
        <path d="M -80 -100 C -95 -120 -65 -135 -55 -115 C -45 -95 -65 -80 -80 -100 Z" />
        <circle cx="-55" cy="-115" r="2" fill="#fff" stroke="none" />
      </g>

      <!-- Kacang Polong -->
      <g fill="url(#peaColor)" stroke="#4a8a1f" stroke-width="1.5">
        <circle cx="-45" cy="-20" r="6" />
        <circle cx="-10" cy="-120" r="5" />
        <circle cx="35" cy="-70" r="6" />
        <circle cx="65" cy="-40" r="5.5" />
        <circle cx="-60" cy="-80" r="5" />
        <circle cx="15" cy="-130" r="5.5" />
        <circle cx="80" cy="-80" r="5" />
      </g>

      <!-- Daun Bawang (Irisan) -->
      <g fill="#4caf50" stroke="#2e7d32" stroke-width="1">
        <rect x="-30" y="-50" width="10" height="4" transform="rotate(45 -30 -50)" rx="2"/>
        <rect x="10" y="-90" width="10" height="4" transform="rotate(-20 10 -90)" rx="2"/>
        <rect x="50" y="-50" width="10" height="4" transform="rotate(15 50 -50)" rx="2"/>
        <rect x="-50" y="-110" width="10" height="4" transform="rotate(-60 -50 -110)" rx="2"/>
        <rect x="30" y="-130" width="10" height="4" transform="rotate(30 30 -130)" rx="2"/>
      </g>
      
      <!-- Efek Partikel Nasi yang Berputar di Udara -->
      <g fill="#fff">
        <circle cx="-100" cy="-70" r="2" opacity="0.8">
          <animate attributeName="cy" values="-70;-90;-70" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="90" cy="-20" r="2" opacity="0.8">
          <animate attributeName="cy" values="-20;-40;-20" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-10" cy="-160" r="2" opacity="0.8">
          <animate attributeName="cy" values="-160;-180;-160" dur="0.9s" repeatCount="indefinite"/>
        </circle>
      </g>

    </g>
  </g>
</svg>
