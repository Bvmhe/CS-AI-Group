<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#121217"/>
    </linearGradient>

    <!-- Wok Metal Gradient -->
    <linearGradient id="wokGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="60%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <!-- Wok Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="50%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4b2c"/>
      <stop offset="100%" stop-color="#4a2a15"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffdf73"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1000" height="300" fill="url(#bgGrad)"/>

  <!-- ================= LEFT SIDE (TEXT) ================= -->
  <g transform="translate(100, 150)">
    <text x="0" y="-20" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="1">
      FENGWEI
    </text>
    <text x="0" y="30" font-family="'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">
      FRIED RICE
    </text>
    <line x1="0" y1="50" x2="280" y2="50" stroke="#ff9f1c" stroke-width="3" opacity="0.8"/>
    <text x="0" y="80" font-family="'Courier New', monospace" font-size="16" fill="#a0a0a0" letter-spacing="2">
      &lt; Wok Mastery &amp; Code /&gt;
    </text>
  </g>

  <!-- ================= RIGHT SIDE (ILLUSTRATION) ================= -->
  <g transform="translate(600, 150)">
    
    <!-- WOK GROUP (Toss Animation) -->
    <g>
      <animateTransform attributeName="transform" type="translate" 
        values="0,0; -2,-3; 3,1; 0,0" dur="0.6s" repeatCount="indefinite" />
      
      <!-- Wok Handle -->
      <path d="M 180 40 L 280 10 Q 285 5 290 8 L 290 25 Q 285 28 280 25 L 185 55 Z" fill="url(#handleGrad)"/>
      <rect x="275" y="6" width="20" height="24" rx="4" fill="#222" stroke="#555" stroke-width="1"/>

      <!-- Wok Body (Bowl shape) -->
      <path d="M -150 20 Q 0 150 150 20 Z" fill="url(#wokGrad)" stroke="#111" stroke-width="2"/>
      
      <!-- Inner Wok dark area -->
      <ellipse cx="0" cy="20" rx="150" ry="30" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
      
      <!-- Wok Rim Highlight -->
      <path d="M -150 20 Q 0 55 150 20" fill="none" stroke="url(#rimGrad)" stroke-width="4" opacity="0.8"/>
      
      <!-- Oil/Sauce reflection in wok -->
      <ellipse cx="0" cy="35" rx="100" ry="15" fill="#3d2b1f" opacity="0.6"/>
    </g>

    <!-- RICE, SHRIMP & PEAS (Flying Arc Animation) -->
    <!-- This group moves up and slightly curves left to simulate the toss -->
    <g>
      <animateTransform attributeName="transform" type="translate" 
        values="0,0; -15,-25; 0,0" dur="0.7s" repeatCount="indefinite" />

      <!-- Main Rice Mound flying up -->
      <path d="M -80 15 Q -100 -80 -20 -120 Q 60 -140 80 -30 Z" fill="#f4e8c1" />
      
      <!-- Flying Grains (White & Golden) -->
      <g fill="#fff6d9">
        <circle cx="-70" cy="-30" r="4" />
        <circle cx="-50" cy="-60" r="3.5" />
        <circle cx="-30" cy="-80" r="4" />
        <circle cx="-10" cy="-95" r="3" />
        <circle cx="10" cy="-105" r="4" />
        <circle cx="30" cy="-110" r="3.5" />
        <circle cx="50" cy="-90" r="4" />
        <circle cx="65" cy="-70" r="3" />
        <circle cx="75" cy="-40" r="4" />
      </g>
      <g fill="#ffd966">
        <circle cx="-60" cy="-45" r="3" />
        <circle cx="-40" cy="-70" r="4" />
        <circle cx="-20" cy="-90" r="3" />
        <circle cx="0" cy="-100" r="4.5" />
        <circle cx="20" cy="-110" r="3" />
        <circle cx="40" cy="-100" r="4" />
        <circle cx="60" cy="-80" r="3.5" />
        <circle cx="70" cy="-55" r="3" />
      </g>

      <!-- Shrimp (Pink/Coral) -->
      <g fill="#ff7b6b" stroke="#e55c4c" stroke-width="1">
        <path d="M -50 -55 Q -40 -70 -25 -65 Q -15 -60 -25 -50 Q -40 -40 -50 -55 Z" />
        <circle cx="-25" cy="-65" r="2" fill="#fff" /> <!-- Eye -->
        
        <path d="M 20 -95 Q 30 -110 45 -105 Q 55 -100 45 -90 Q 30 -80 20 -95 Z" />
        <circle cx="45" cy="-105" r="2" fill="#fff" />

        <path d="M -10 -80 Q 0 -95 15 -90 Q 25 -85 15 -75 Q 0 -65 -10 -80 Z" />
        <circle cx="15" cy="-90" r="2" fill="#fff" />
      </g>

      <!-- Green Peas -->
      <g fill="#7bc043" stroke="#559a2b" stroke-width="1">
        <circle cx="-35" cy="-75" r="4.5" />
        <circle cx="5" cy="-105" r="5" />
        <circle cx="45" cy="-85" r="4" />
        <circle cx="60" cy="-60" r="4.5" />
        <circle cx="-65" cy="-40" r="4" />
      </g>

      <!-- Green Onion (Scallions) bits -->
      <g fill="#4caf50">
        <rect x="-40" y="-85" width="6" height="2" transform="rotate(45 -40 -85)" />
        <rect x="15" y="-100" width="6" height="2" transform="rotate(-30 15 -100)" />
        <rect x="50" y="-75" width="6" height="2" transform="rotate(20 50 -75)" />
      </g>
    </g>

    <!-- STEAM (Soft, floating up) -->
    <g opacity="0.4" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <path d="M -40 -120 Q -60 -150 -40 -180">
        <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 20 -110 Q 0 -140 20 -170">
        <animate attributeName="opacity" values="0.5;0" dur="2.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60 -90 Q 40 -120 60 -150">
        <animate attributeName="opacity" values="0.4;0" dur="2.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- FIRE FLAME Glow under wok (Subtle) -->
    <ellipse cx="0" cy="80" rx="100" ry="20" fill="#ff5500" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="0.3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="20;25;20" dur="0.4s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
