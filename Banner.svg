<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    
    <linearGradient id="wokBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="40%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    
    <linearGradient id="wokInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>

    <!-- Handle Gradients -->
    <linearGradient id="metalNeck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="woodHandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="20%" stop-color="#c07b4b"/>
      <stop offset="80%" stop-color="#7a4121"/>
      <stop offset="100%" stop-color="#4a2510"/>
    </linearGradient>

    <!-- Shrimp Gradients -->
    <linearGradient id="shrimpColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e8e"/>
      <stop offset="100%" stop-color="#f25c48"/>
    </linearGradient>

    <!-- Text Glow -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffdf73"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1000" height="300" fill="url(#bgGrad)"/>

  <!-- ================= LEFT SIDE (TEXT) ================= -->
  <g transform="translate(100, 150)">
    <text x="0" y="-20" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="1">
      FENGWEI
    </text>
    <text x="0" y="30" font-family="'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">
      FRIED RICE
    </text>
    <line x1="0" y1="50" x2="280" y2="50" stroke="#ff9f1c" stroke-width="3" opacity="0.8"/>
    <text x="0" y="80" font-family="'Courier New', monospace" font-size="16" fill="#a0a0a0" letter-spacing="2">
      &lt; Wok Mastery &amp; Code /&gt;
    </text>
  </g>

  <!-- ================= RIGHT SIDE (ILLUSTRATION) ================= -->
  <g transform="translate(700, 180)">
    
    <!-- WOK GROUP (Goyang Animasi) -->
    <g>
      <animateTransform attributeName="transform" type="translate" 
        values="0,0; -4,2; 4,-2; 0,0" dur="0.6s" repeatCount="indefinite" />

      <!-- Konektor Metal (Leher Wok) -->
      <path d="M 120 -10 L 180 -25 L 180 5 L 120 20 Z" fill="url(#metalNeck)"/>
      
      <!-- Gagang Kayu Melengkung -->
      <path d="M 180 -25 Q 240 -40 260 -50 L 265 -30 Q 240 -20 180 5 Z" fill="url(#woodHandle)"/>
      
      <!-- Bodi Wok -->
      <path d="M -160 0 A 160 110 0 0 0 160 0 Z" fill="url(#wokBody)"/>
      
      <!-- Rongga Dalam Wok (Cekung) -->
      <ellipse cx="0" cy="0" rx="160" ry="35" fill="url(#wokInner)" stroke="#ddd" stroke-width="2"/>
      
      <!-- Minyak di dasar wok -->
      <ellipse cx="0" cy="10" rx="110" ry="18" fill="#1c1008" opacity="0.9"/>
      <!-- Pantulan minyak -->
      <path d="M -60 5 Q 0 -5 60 5" fill="none" stroke="#555" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- ================= NASI & TOPPING TERBANG ================= -->
    <!-- Semua elemen dibungkus dalam <g> agar bisa dianimasikan naik-turun -->
    <g>
      <animateTransform attributeName="transform" type="translate" 
        values="0,5; -10,-25; 0,5" dur="0.8s" repeatCount="indefinite" />

      <!-- Gundukan nasi di dalam wok -->
      <ellipse cx="0" cy="0" rx="100" ry="20" fill="#f4e8c1" />

      <!-- Kumpulan Butiran Nasi (Menggunakan pattern berulang / path bergerigi agar terlihat seperti tumpukan) -->
      <g fill="#fcf3d4">
        <!-- Nasi bagian bawah -->
        <rect x="-60" y="-10" width="8" height="3" transform="rotate(15 -60 -10)" rx="1"/>
        <rect x="-40" y="-15" width="8" height="3" transform="rotate(-20 -40 -15)" rx="1"/>
        <rect x="-10" y="-5" width="8" height="3" transform="rotate(30 -10 -5)" rx="1"/>
        <rect x="20" y="-12" width="8" height="3" transform="rotate(-10 20 -12)" rx="1"/>
        <rect x="50" y="-8" width="8" height="3" transform="rotate(25 50 -8)" rx="1"/>
        
        <!-- Nasi melengkung ke atas -->
        <rect x="-80" y="-30" width="7" height="3" transform="rotate(45 -80 -30)" rx="1"/>
        <rect x="-60" y="-50" width="8" height="3" transform="rotate(-15 -60 -50)" rx="1"/>
        <rect x="-30" y="-70" width="8" height="3" transform="rotate(30 -30 -70)" rx="1"/>
        <rect x="-10" y="-90" width="7" height="3" transform="rotate(-40 -10 -90)" rx="1"/>
        <rect x="20" y="-100" width="8" height="3" transform="rotate(10 20 -100)" rx="1"/>
        <rect x="50" y="-80" width="8" height="3" transform="rotate(-25 50 -80)" rx="1"/>
        <rect x="70" y="-50" width="7" height="3" transform="rotate(35 70 -50)" rx="1"/>
        
        <!-- Nasi di puncak lengkungan -->
        <rect x="-50" y="-100" width="8" height="3" transform="rotate(-15 -50 -100)" rx="1"/>
        <rect x="-20" y="-130" width="8" height="3" transform="rotate(25 -20 -130)" rx="1"/>
        <rect x="10" y="-140" width="7" height="3" transform="rotate(-30 10 -140)" rx="1"/>
        <rect x="40" y="-120" width="8" height="3" transform="rotate(15 40 -120)" rx="1"/>
        
        <!-- Nasi hambur terpisah -->
        <rect x="-110" y="-60" width="6" height="3" transform="rotate(70 -110 -60)" rx="1"/>
        <rect x="90" y="-20" width="7" height="3" transform="rotate(-45 90 -20)" rx="1"/>
        <rect x="-90" y="-80" width="6" height="3" transform="rotate(15 -90 -80)" rx="1"/>
      </g>

      <!-- Variasi Warna Nasi (Kuning Telur/Emas) -->
      <g fill="#ffd966">
        <rect x="-50" y="-40" width="8" height="3" transform="rotate(-10 -50 -40)" rx="1"/>
        <rect x="-20" y="-60" width="7" height="3" transform="rotate(20 -20 -60)" rx="1"/>
        <rect x="10" y="-80" width="8" height="3" transform="rotate(-30 10 -80)" rx="1"/>
        <rect x="40" y="-110" width="7" height="3" transform="rotate(40 40 -110)" rx="1"/>
        <rect x="-70" y="-90" width="8" height="3" transform="rotate(-20 -70 -90)" rx="1"/>
      </g>

      <!-- ================= UDANG (SHRIMP) ================= -->
      <g fill="url(#shrimpColor)" stroke="#d14937" stroke-width="1">
        <!-- Udang 1 (Bawah Kiri) -->
        <path d="M -80 -20 C -90 -40 -70 -50 -60 -40 C -50 -30 -60 -10 -80 -20 Z" />
        <circle cx="-60" cy="-40" r="2" fill="#fff" stroke="none"/>
        
        <!-- Udang 2 (Tengah Kiri) -->
        <path d="M -70 -80 C -85 -100 -60 -115 -50 -100 C -40 -85 -50 -60 -70 -80 Z" />
        <circle cx="-50" cy="-100" r="2" fill="#fff" stroke="none"/>
        
        <!-- Udang 3 (Atas) -->
        <path d="M -10 -130 C -20 -150 10 -165 20 -150 C 30 -135 20 -110 -10 -130 Z" />
        <circle cx="20" cy="-150" r="2" fill="#fff" stroke="none"/>
        
        <!-- Udang 4 (Kanan Atas) -->
        <path d="M 50 -110 C 40 -130 70 -140 80 -120 C 90 -100 70 -90 50 -110 Z" />
        <circle cx="80" cy="-120" r="2" fill="#fff" stroke="none"/>
        
        <!-- Udang 5 (Kanan Bawah) -->
        <path d="M 40 -30 C 30 -50 60 -60 70 -40 C 80 -20 60 -10 40 -30 Z" />
        <circle cx="70" cy="-40" r="2" fill="#fff" stroke="none"/>
      </g>

      <!-- ================= KACANG POLONG (PEAS) ================= -->
      <g fill="#7bc043" stroke="#559a2b" stroke-width="1.5">
        <circle cx="-40" cy="-25" r="5" />
        <circle cx="-10" cy="-115" r="5" />
        <circle cx="45" cy="-70" r="5" />
        <circle cx="-90" cy="-55" r="4" />
        <circle cx="65" cy="-100" r="4.5" />
        <circle cx="-50" cy="-115" r="4.5" />
        <circle cx="30" cy="-25" r="4" />
        <circle cx="10" cy="-90" r="5" />
      </g>

      <!-- ================= DAUN BAWANG (SCALLIONS) ================= -->
      <g fill="#4caf50">
        <rect x="-45" y="-70" width="8" height="3" transform="rotate(45 -45 -70)" rx="1"/>
        <rect x="0" y="-140" width="8" height="3" transform="rotate(-20 0 -140)" rx="1"/>
        <rect x="60" y="-60" width="8" height="3" transform="rotate(15 60 -60)" rx="1"/>
        <rect x="-30" y="-100" width="7" height="3" transform="rotate(-50 -30 -100)" rx="1"/>
        <rect x="30" y="-80" width="8" height="3" transform="rotate(30 30 -80)" rx="1"/>
        <rect x="-80" y="-30" width="7" height="3" transform="rotate(-15 -80 -30)" rx="1"/>
      </g>
    </g>
  </g>
</svg>
