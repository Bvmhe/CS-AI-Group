<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matriks Neural Network Pink</title>
<style>
    /* Mengatur font dan background halaman */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fff0f5; /* Latar belakang pink sangat muda */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    /* Kotak utama pembungkus */
    .container {
        background-color: #ffffff;
        padding: 40px 50px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2); /* Bayangan warna pink */
        border: 2px solid #ffb6c1; /* Garis tepi pink */
        display: flex;
        align-items: center;
        gap: 30px; /* Jarak antar kolom */
    }

    /* Gaya untuk setiap kolom (W, x, y) */
    .column {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Judul kolom */
    .title {
        font-weight: 800;
        color: #d81b60; /* Warna teks pink tua */
        font-size: 1.2rem;
        margin-bottom: 25px;
        text-align: center;
        letter-spacing: 0.5px;
    }

    /* Sub-judul (rows = neurons) */
    .subtitle {
        font-size: 0.85rem;
        color: #f06292; /* Warna pink sedang */
        margin-top: -20px;
        margin-bottom: 20px;
        font-weight: 600;
    }

    /* Wadah untuk matriks (kotak kurung siku) */
    .matrix-box {
        display: flex;
        align-items: center;
        position: relative;
        padding: 0 15px;
    }

    /* Membuat kurung siku kiri dan kanan */
    .matrix-box::before,
    .matrix-box::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 10px;
        border: 3px solid #ff69b4; /* Warna kurung pink terang */
    }

    .matrix-box::before {
        left: 0;
        border-right: none;
        border-radius: 5px 0 0 5px;
    }

    .matrix-box::after {
        right: 0;
        border-left: none;
        border-radius: 0 5px 5px 0;
    }

    /* Tabel untuk menyusun angka dalam matriks */
    table {
        border-collapse: collapse;
        margin: 10px 5px;
    }

    td, th {
        padding: 12px 15px;
        text-align: center;
        font-size: 1.1rem;
        color: #4a4a4a; /* Warna teks abu-abu gelap agar mudah dibaca */
        font-family: 'Courier New', Courier, monospace; /* Font ala matematika */
        font-weight: bold;
    }

    /* Warna khusus untuk variabel (huruf) agar lebih hidup */
    .var {
        color: #d81b60;
    }

    /* Simbol perkalian dan sama dengan */
    .operator {
        font-size: 2rem;
        color: #ff69b4;
        font-weight: bold;
        margin: 0 10px;
        text-shadow: 0 2px 5px rgba(255, 105, 180, 0.3);
    }

    /* Highlight pada hasil output */
    .output-cell {
        background-color: #fce4ec;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 1rem;
    }

    /* Responsif untuk layar kecil */
    @media (max-width: 900px) {
        .container {
            flex-direction: column;
            padding: 30px;
        }
        .operator {
            transform: rotate(90deg);
            margin: 15px 0;
        }
    }
</style>
</head>
<body>

<div class="container">
    
    <!-- Kolom Weight Matrix W -->
    <div class="column">
        <div class="title">Weight matrix W</div>
        <div class="subtitle">(rows = neurons)</div>
        <div class="matrix-box">
            <table>
                <tr>
                    <td>[ <span class="var">w11</span></td>
                    <td><span class="var">w12</span></td>
                    <td><span class="var">w13</span> ]</td>
                </tr>
                <tr>
                    <td>[ <span class="var">w21</span></td>
                    <td><span class="var">w22</span></td>
                    <td><span class="var">w23</span> ]</td>
                </tr>
                <tr>
                    <td>[ <span class="var">w31</span></td>
                    <td><span class="var">w32</span></td>
                    <td><span class="var">w33</span> ]</td>
                </tr>
            </table>
        </div>
    </div>

    <!-- Simbol Kali -->
    <div class="operator">&times;</div>

    <!-- Kolom Input Vector x -->
    <div class="column">
        <div class="title">Input vector x</div>
        <div class="subtitle">&nbsp;</div> <!-- Spacer agar sejajar -->
        <div class="matrix-box">
            <table>
                <tr><td>[ <span class="var">x1</span> ]</td></tr>
                <tr><td>[ <span class="var">x2</span> ]</td></tr>
                <tr><td>[ <span class="var">x3</span> ]</td></tr>
            </table>
        </div>
    </div>

    <!-- Simbol Sama Dengan -->
    <div class="operator">=</div>

    <!-- Kolom Output Vector y -->
    <div class="column">
        <div class="title">Output vector y</div>
        <div class="subtitle">&nbsp;</div> <!-- Spacer agar sejajar -->
        <div class="matrix-box">
            <table>
                <tr>
                    <td class="output-cell">[ <span class="var">w11</span>&middot;<span class="var">x1</span> + <span class="var">w12</span>&middot;<span class="var">x2</span> + <span class="var">w13</span>&middot;<span class="var">x3</span> ]</td>
                </tr>
                <tr>
                    <td class="output-cell">[ <span class="var">w21</span>&middot;<span class="var">x1</span> + <span class="var">w22</span>&middot;<span class="var">x2</span> + <span class="var">w23</span>&middot;<span class="var">x3</span> ]</td>
                </tr>
                <tr>
                    <td class="output-cell">[ <span class="var">w31</span>&middot;<span class="var">x1</span> + <span class="var">w32</span>&middot;<span class="var">x2</span> + <span class="var">w33</span>&middot;<span class="var">x3</span> ]</td>
                </tr>
            </table>
        </div>
    </div>

</div>

</body>
</html>
